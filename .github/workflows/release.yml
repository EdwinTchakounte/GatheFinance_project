# Build + push des 4 images de production vers GitHub Container Registry.
#
# Déclencheurs :
#   - push sur main → tags `latest` + `main` + `sha-<short>`
#   - workflow_dispatch (manuel) → mêmes tags
#
# Côté VPS Contabo, après ce workflow :
#   docker login ghcr.io -u <gh-user> -p <PAT_read_packages>
#   cd /opt/gathe-finance/infra
#   docker compose -f docker-compose.prod.yml --env-file .env.prod pull
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Plus de `--build` côté VPS : on tire les images déjà construites par CI
# (gain ~5 min de build à chaque deploy).

name: Build and push prod images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # ${{ github.repository }} = "EdwinTchakounte/GatheFinance_project"
  # On lowercase pour ghcr (case-insensitive mais convention).
  IMAGE_BASE: ghcr.io/edwintchakounte/gathefinance_project

  # Domaines de prod (cf. infra/.env.prod.example + memory deploy-contabo).
  # Embedded au build pour Next.js (NEXT_PUBLIC_* sont figés à la compile).
  SITE_DOMAIN: gathe-finance.horus-lab.com
  PORTAL_DOMAIN: portail.gathe-finance.horus-lab.com
  ADMIN_DOMAIN: admin.gathe-finance.horus-lab.com

jobs:
  build:
    name: build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
            target: prod
            build_args: ""
          - image: site
            context: frontend
            target: runner-site
            build_args: |
              CMS_API_URL=http://backend:8000
              NEXT_PUBLIC_SITE_URL=https://gathe-finance.horus-lab.com
              NEXT_PUBLIC_PORTAL_URL=https://portail.gathe-finance.horus-lab.com
          - image: portal
            context: frontend
            target: runner-portal
            build_args: |
              BACKEND_INTERNAL_URL=http://backend:8000
              NEXT_PUBLIC_SITE_URL=https://gathe-finance.horus-lab.com
          - image: admin
            context: frontend
            target: runner-admin
            build_args: |
              BACKEND_INTERNAL_URL=http://backend:8000
              NEXT_PUBLIC_PORTAL_URL=https://portail.gathe-finance.horus-lab.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
