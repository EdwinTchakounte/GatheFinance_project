# Manuel . workflow_dispatch pour rejouer les seeds idempotents sur le VPS
# prod sans avoir a SSH a la main. Reutilise les memes secrets que deploy.yml.
#
# Cibles : seed_email_templates (--force par defaut pour recrire les
# templates DB) + seed_event_catalog (cree les EventConfig + EventHook
# manquants pour les emit_event() ajoutes recemment).
#
# Idempotent : peut etre rejoue sans risque.

name: Seed prod (templates email + event catalog)

on:
  workflow_dispatch:
    inputs:
      full_pg_dump:
        description: "Dump COMPLET de la base (pg_dump → /backups/gathe-JOUR.sql.gz, inclut comptes/logins) AVANT tout ?"
        type: boolean
        default: false
      force_recreate_backend:
        description: "Force-recreate backend+qcluster (récupère la nouvelle image quand le deploy n'a pas recréé) ?"
        type: boolean
        default: false
      seed_email_templates:
        description: "Rejouer seed_email_templates --force ?"
        type: boolean
        default: true
      seed_event_catalog:
        description: "Rejouer seed_event_catalog ?"
        type: boolean
        default: true
      seed_form_schemas:
        description: "Rejouer seed_form_schemas --force ? (active le schema demande sans la question CFP)"
        type: boolean
        default: false
      seed_fees:
        description: "Rejouer seed_fees ? (crée FeeType + RateParam TRANSACTION_FEE 3% si absents, jamais écrasés)"
        type: boolean
        default: false
      set_transaction_fee_3pct:
        description: "Fixer le frais de transaction à 3% sur le versement seul (ÉCRASE la valeur actuelle) ?"
        type: boolean
        default: false
      backfill_ecriture_carnets:
        description: "Rattacher les écritures historiques à leur carnet (backfill_ecriture_carnets --commit, non destructif, une seule fois) ?"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  seed:
    name: Seed via SSH
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Run seeds via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          command_timeout: 5m
          envs: SEED_EMAIL,SEED_EVENTS
          script: |
            set -euo pipefail

            DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH || '/opt/gathe-finance' }}"
            COMPOSE="docker compose -f docker-compose.prod.yml -f docker-compose.client.yml --env-file .env.prod"

            cd "$DEPLOY_PATH/infra"

            echo ">>> DIAG backend (image + commande backfill présente ?)"
            $COMPOSE ps backend | tail -2 || true
            $COMPOSE exec -T backend sh -c "python manage.py help 2>/dev/null | grep -i backfill_ecriture_carnets || echo '  (commande backfill ABSENTE = ancien code)'" || true

            if [ "${{ inputs.full_pg_dump }}" = "true" ]; then
              echo ">>> Dump COMPLET de la base (pg_dump, inclut comptes/logins) AVANT toute modif"
              $COMPOSE exec -T backup /usr/local/bin/backup.sh
              echo ">>> Dumps présents :"
              $COMPOSE exec -T backup sh -c 'ls -lh /backups | tail -10'
            else
              echo ">>> full_pg_dump skipped"
            fi

            if [ "${{ inputs.force_recreate_backend }}" = "true" ]; then
              echo ">>> Force-recreate backend + qcluster (récupère la nouvelle image ; l'entrypoint rejoue migrate)"
              $COMPOSE pull backend qcluster || echo "  (pull KO — on continue sur le cache)"
              $COMPOSE up -d --force-recreate --no-deps backend qcluster
              echo "  attente démarrage (migrate)..."
              sleep 12
            else
              echo ">>> force_recreate_backend skipped"
            fi

            if [ "${{ inputs.seed_email_templates }}" = "true" ]; then
              echo ">>> seed_email_templates --force"
              $COMPOSE exec -T backend python manage.py seed_email_templates --force
            else
              echo ">>> seed_email_templates skipped"
            fi

            if [ "${{ inputs.seed_event_catalog }}" = "true" ]; then
              echo ">>> seed_event_catalog"
              $COMPOSE exec -T backend python manage.py seed_event_catalog
            else
              echo ">>> seed_event_catalog skipped"
            fi

            if [ "${{ inputs.seed_form_schemas }}" = "true" ]; then
              echo ">>> seed_form_schemas --force"
              $COMPOSE exec -T backend python manage.py seed_form_schemas --force
            else
              echo ">>> seed_form_schemas skipped"
            fi

            if [ "${{ inputs.seed_fees }}" = "true" ]; then
              echo ">>> seed_fees"
              $COMPOSE exec -T backend python manage.py seed_fees
            else
              echo ">>> seed_fees skipped"
            fi

            if [ "${{ inputs.set_transaction_fee_3pct }}" = "true" ]; then
              echo ">>> set_transaction_fee --rate 0.03 --operations versement"
              $COMPOSE exec -T backend python manage.py set_transaction_fee --rate 0.03 --operations versement
            else
              echo ">>> set_transaction_fee skipped"
            fi

            if [ "${{ inputs.backfill_ecriture_carnets }}" = "true" ]; then
              echo ">>> backfill_ecriture_carnets (dry-run)"
              $COMPOSE exec -T backend python manage.py backfill_ecriture_carnets
              echo ">>> backfill_ecriture_carnets --commit"
              $COMPOSE exec -T backend python manage.py backfill_ecriture_carnets --commit
            else
              echo ">>> backfill_ecriture_carnets skipped"
            fi

            echo ">>> Done."
