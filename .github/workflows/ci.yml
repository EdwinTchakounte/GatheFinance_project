# Pipeline CI/CD : tests obligatoires, puis build + push GHCR si tests verts.
#
# Declenchement :
#   - push main         -> tests + build (publie sur GHCR)
#   - pull_request main -> tests seulement (gating avant merge)
#   - workflow_dispatch -> rejouer a la demande
#
# Gating :
#   - build-backend  ne tourne que si test-backend  est vert
#   - build-frontend ne tourne que si test-frontend est vert
#   - test-mobile est purement informatif (echec mobile = mobile rouge, mais
#     n'empeche pas le deploy web : le mobile est livre via Play Store, pas
#     via GHCR)

name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/edwintchakounte/gathefinance_project
  SITE_DOMAIN: gathe-finance.horus-lab.com
  PORTAL_DOMAIN: portail.gathe-finance.horus-lab.com
  ADMIN_DOMAIN: admin.gathe-finance.horus-lab.com

# ---------------------------------------------------------------------------
# JOBS
# ---------------------------------------------------------------------------
jobs:

  # -------------------------------------------------------------------------
  # Tests backend : ruff (lint) + pytest (745 cas, Postgres reel)
  # -------------------------------------------------------------------------
  test-backend:
    name: test backend (pytest + ruff)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gathe
          POSTGRES_PASSWORD: gathe
          POSTGRES_DB: gathe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gathe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-insecure-key-do-not-use-in-prod
      DATABASE_URL: postgres://gathe:gathe@localhost:5432/gathe_test
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Lint with ruff
        working-directory: backend
        run: ruff check .

      - name: Run pytest
        working-directory: backend
        # --reuse-db est dans pytest.ini, on l'override pour la CI (DB fraiche)
        run: pytest --create-db -q

  # -------------------------------------------------------------------------
  # Tests frontend : npm lint (eslint) + typecheck (tsc) sur les 5 workspaces
  # -------------------------------------------------------------------------
  test-frontend:
    name: test frontend (lint + typecheck)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck (all workspaces)
        working-directory: frontend
        run: npm run typecheck

  # -------------------------------------------------------------------------
  # Tests mobile : flutter analyze + flutter test (66 cas)
  # Echec mobile = mobile rouge, mais n'empeche pas le deploy web (pas de
  # `needs` dans les jobs build-*). Le mobile est livre via Play Store.
  # -------------------------------------------------------------------------
  test-mobile:
    name: test mobile (analyze + flutter test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Latest stable. Le pubspec demande intl ^0.20.2 qui necessite
          # le SDK Flutter >= 3.32 (flutter_localizations pinne intl).
          channel: stable
          cache: true

      - name: Fetch packages
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        # --no-fatal-{infos,warnings} : on tolere le cleanup historique
        # (unawaited_futures, prefer_const_constructors, trailing commas).
        # Un sweep dedie viendra durcir ces regles. On garde l'analyze pour
        # detecter les vraies erreurs (type mismatch, undefined name).
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        working-directory: mobile
        run: flutter test --reporter=expanded

  # -------------------------------------------------------------------------
  # Build backend : pas avant pytest vert
  # -------------------------------------------------------------------------
  build-backend:
    name: build backend image
    needs: test-backend
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: backend
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  # -------------------------------------------------------------------------
  # Build frontend (3 images en parallele) : pas avant lint + typecheck verts
  # -------------------------------------------------------------------------
  build-frontend:
    name: build ${{ matrix.image }} image
    needs: test-frontend
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: site
            target: runner-site
          - image: portal
            target: runner-portal
          - image: admin
            target: runner-admin

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Domaines figés au build (NEXT_PUBLIC_*) : main → domaines CLIENT,
      # staging/autre → nos domaines horus-lab. Repli sur horus-lab si les
      # variables de dépôt ne sont pas encore définies (rien ne casse avant
      # la config du client). Voir infra/DEPLOY_ENVIRONMENTS.md.
      - name: Resolve build-time domains (per branch)
        id: dom
        run: |
          # Noms DISSOCIÉS par cible : main → CLIENT_* (serveur cliente DMZ Traefik),
          # staging/autre → STAGING_* (notre Contabo horus-lab). Aucun repli
          # croisé possible. Repli sur horus-lab tant que les variables ne sont
          # pas posées (rien ne casse avant la config client).
          if [ "${{ github.ref_name }}" = "main" ]; then
            SITE="${{ vars.CLIENT_SITE_DOMAIN || 'gathe-finance.horus-lab.com' }}"
            PORTAL="${{ vars.CLIENT_PORTAL_DOMAIN || 'portail.gathe-finance.horus-lab.com' }}"
          else
            SITE="${{ vars.STAGING_SITE_DOMAIN || 'gathe-finance.horus-lab.com' }}"
            PORTAL="${{ vars.STAGING_PORTAL_DOMAIN || 'portail.gathe-finance.horus-lab.com' }}"
          fi
          echo "Resolved: SITE=$SITE PORTAL=$PORTAL (branch=${{ github.ref_name }})"
          {
            echo 'args<<GHAEOF'
            case "${{ matrix.image }}" in
              site)
                echo "CMS_API_URL=http://backend:8000"
                echo "NEXT_PUBLIC_SITE_URL=https://$SITE"
                echo "NEXT_PUBLIC_PORTAL_URL=https://$PORTAL"
                ;;
              portal)
                echo "BACKEND_INTERNAL_URL=http://backend:8000"
                echo "NEXT_PUBLIC_SITE_URL=https://$SITE"
                ;;
              admin)
                echo "BACKEND_INTERNAL_URL=http://backend:8000"
                echo "NEXT_PUBLIC_PORTAL_URL=https://$PORTAL"
                ;;
            esac
            echo 'GHAEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: frontend
          target: ${{ matrix.target }}
          build-args: ${{ steps.dom.outputs.args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  # -------------------------------------------------------------------------
  # Deploy STAGING -> NOTRE serveur (Contabo, nginx mutualise externe).
  #
  # Auto-contenu : ce job s'execute depuis la branche `staging` elle-meme
  # (donc AUCUN changement requis sur main / deploy.yml). Ne se declenche que
  # sur push a `staging` et apres build backend + frontend verts.
  #
  # Config cote GitHub -> Settings > Environments > `staging` :
  #   secrets   : VPS_HOST, VPS_USER, VPS_SSH_PRIVATE_KEY, VPS_DEPLOY_PATH(opt)
  #   variables : SITE_DOMAIN, API_DOMAIN, PORTAL_DOMAIN, ADMIN_DOMAIN,
  #               CMS_DOMAIN, SITE_URL, EXTERNAL_NGINX_CONTAINER(opt)
  # Si VPS_HOST n'est pas encore renseigne, le job s'ignore proprement.
  # Voir infra/DEPLOY_ENVIRONMENTS.md.
  # -------------------------------------------------------------------------
  deploy-staging:
    name: deploy staging (notre serveur)
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard - env staging configure ?
        id: guard
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "::warning::Environment 'staging' non configure (secret VPS_HOST vide) - deploy ignore. Renseigne Settings > Environments > staging."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Hash infra/
        id: infra_hash
        if: steps.guard.outputs.skip == 'false'
        run: |
          HASH=$(find infra/ -type f \( -name "*.yml" -o -name "*.conf" -o -name "*.sh" \) -print0 \
            | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-12)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Upload infra/ vers le serveur
        if: steps.guard.outputs.skip == 'false'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "infra/docker-compose.prod.yml,infra/docker-compose.nginx-external.yml,infra/nginx.gathe-finance.container.conf,infra/scripts/*"
          target: "${{ secrets.VPS_DEPLOY_PATH || '/opt/gathe-finance' }}/"
          overwrite: true
          strip_components: 0

      - name: Deploy via SSH (mode nginx externe, tag :staging)
        if: steps.guard.outputs.skip == 'false'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          command_timeout: 12m
          script: |
            set -euo pipefail
            INFRA_HASH="${{ steps.infra_hash.outputs.hash }}"
            DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH || '/opt/gathe-finance' }}"
            EXTERNAL_NGINX="${{ vars.EXTERNAL_NGINX_CONTAINER || 'backend-nginx-1' }}"
            NEW_TAG="staging"
            COMPOSE="docker compose -f docker-compose.prod.yml -f docker-compose.nginx-external.yml --env-file .env.prod"

            cd "$DEPLOY_PATH/infra"

            HASH_FILE="$DEPLOY_PATH/.infra_hash"
            PREV_HASH=$(cat "$HASH_FILE" 2>/dev/null || echo "none")
            if [ "$PREV_HASH" != "$INFRA_HASH" ]; then
              RECREATE_FLAG="--force-recreate"
            else
              RECREATE_FLAG=""
            fi
            echo "$INFRA_HASH" > "$HASH_FILE"

            CURRENT_TAG=$(grep "^GATHE_IMAGE_TAG=" .env.prod | cut -d= -f2 || echo "latest")
            echo ">>> staging deploy : current=$CURRENT_TAG -> new=$NEW_TAG"
            sed -i.bak "s/^GATHE_IMAGE_TAG=.*/GATHE_IMAGE_TAG=$NEW_TAG/" .env.prod

            echo ">>> Pulling images..."
            $COMPOSE pull

            echo ">>> Starting services... ${RECREATE_FLAG:-(no recreate)}"
            $COMPOSE up -d ${RECREATE_FLAG}

            echo ">>> Waiting for backend healthcheck..."
            for i in $(seq 1 18); do
              STATUS=$($COMPOSE ps --format json backend 2>/dev/null | grep -o '"Health":"[^"]*"' | cut -d'"' -f4 || echo "unknown")
              echo "  attempt $i/18: backend=$STATUS"
              [ "$STATUS" = "healthy" ] && break
              if [ "$i" -eq "18" ]; then
                echo "!!! Backend never healthy. Rolling back to $CURRENT_TAG."
                sed -i.bak "s/^GATHE_IMAGE_TAG=.*/GATHE_IMAGE_TAG=$CURRENT_TAG/" .env.prod
                $COMPOSE up -d
                exit 1
              fi
              sleep 5
            done

            echo ">>> Reloading external nginx ($EXTERNAL_NGINX)..."
            docker restart "$EXTERNAL_NGINX" || true
            echo ">>> Staging deploy OK (:staging)"
            $COMPOSE ps

      - name: Smoke tests
        if: steps.guard.outputs.skip == 'false'
        env:
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          PORTAL_DOMAIN: ${{ vars.PORTAL_DOMAIN }}
          ADMIN_DOMAIN: ${{ vars.ADMIN_DOMAIN }}
          CMS_DOMAIN: ${{ vars.CMS_DOMAIN }}
        run: |
          set -e
          FAILED=0
          for url in \
            "https://${API_DOMAIN}/healthz/" \
            "https://${SITE_DOMAIN}/" \
            "https://${PORTAL_DOMAIN}/" \
            "https://${ADMIN_DOMAIN}/" \
            "https://${CMS_DOMAIN}/admin/"
          do
            code=$(curl -sLo /dev/null -w "%{http_code}" --max-time 15 "$url" || echo "000")
            if [[ "$code" =~ ^(2|3) ]]; then echo "OK   $url -> $code"; else echo "FAIL $url -> $code"; FAILED=$((FAILED+1)); fi
          done
          [ "$FAILED" -gt 0 ] && { echo "$FAILED endpoint(s) KO"; exit 1; } || echo "Endpoints OK"
