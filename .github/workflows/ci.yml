# Pipeline CI/CD : tests obligatoires, puis build + push GHCR si tests verts.
#
# Declenchement :
#   - push main         -> tests + build (publie sur GHCR)
#   - pull_request main -> tests seulement (gating avant merge)
#   - workflow_dispatch -> rejouer a la demande
#
# Gating :
#   - build-backend  ne tourne que si test-backend  est vert
#   - build-frontend ne tourne que si test-frontend est vert
#   - test-mobile est purement informatif (echec mobile = mobile rouge, mais
#     n'empeche pas le deploy web : le mobile est livre via Play Store, pas
#     via GHCR)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/edwintchakounte/gathefinance_project
  SITE_DOMAIN: gathe-finance.horus-lab.com
  PORTAL_DOMAIN: portail.gathe-finance.horus-lab.com
  ADMIN_DOMAIN: admin.gathe-finance.horus-lab.com

# ---------------------------------------------------------------------------
# JOBS
# ---------------------------------------------------------------------------
jobs:

  # -------------------------------------------------------------------------
  # Tests backend : ruff (lint) + pytest (745 cas, Postgres reel)
  # -------------------------------------------------------------------------
  test-backend:
    name: test backend (pytest + ruff)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gathe
          POSTGRES_PASSWORD: gathe
          POSTGRES_DB: gathe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gathe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-insecure-key-do-not-use-in-prod
      DATABASE_URL: postgres://gathe:gathe@localhost:5432/gathe_test
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Lint with ruff
        working-directory: backend
        run: ruff check .

      - name: Run pytest
        working-directory: backend
        # --reuse-db est dans pytest.ini, on l'override pour la CI (DB fraiche)
        run: pytest --create-db -q

  # -------------------------------------------------------------------------
  # Tests frontend : npm lint (eslint) + typecheck (tsc) sur les 5 workspaces
  # -------------------------------------------------------------------------
  test-frontend:
    name: test frontend (lint + typecheck)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck (all workspaces)
        working-directory: frontend
        run: npm run typecheck

  # -------------------------------------------------------------------------
  # Tests mobile : flutter analyze + flutter test (66 cas)
  # Echec mobile = mobile rouge, mais n'empeche pas le deploy web (pas de
  # `needs` dans les jobs build-*). Le mobile est livre via Play Store.
  # -------------------------------------------------------------------------
  test-mobile:
    name: test mobile (analyze + flutter test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Latest stable. Le pubspec demande intl ^0.20.2 qui necessite
          # le SDK Flutter >= 3.32 (flutter_localizations pinne intl).
          channel: stable
          cache: true

      - name: Fetch packages
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        # --no-fatal-{infos,warnings} : on tolere le cleanup historique
        # (unawaited_futures, prefer_const_constructors, trailing commas).
        # Un sweep dedie viendra durcir ces regles. On garde l'analyze pour
        # detecter les vraies erreurs (type mismatch, undefined name).
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        working-directory: mobile
        run: flutter test --reporter=expanded

  # -------------------------------------------------------------------------
  # Build backend : pas avant pytest vert
  # -------------------------------------------------------------------------
  build-backend:
    name: build backend image
    needs: test-backend
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: backend
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  # -------------------------------------------------------------------------
  # Build frontend (3 images en parallele) : pas avant lint + typecheck verts
  # -------------------------------------------------------------------------
  build-frontend:
    name: build ${{ matrix.image }} image
    needs: test-frontend
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: site
            target: runner-site
            build_args: |
              CMS_API_URL=http://backend:8000
              NEXT_PUBLIC_SITE_URL=https://gathe-finance.horus-lab.com
              NEXT_PUBLIC_PORTAL_URL=https://portail.gathe-finance.horus-lab.com
          - image: portal
            target: runner-portal
            build_args: |
              BACKEND_INTERNAL_URL=http://backend:8000
              NEXT_PUBLIC_SITE_URL=https://gathe-finance.horus-lab.com
          - image: admin
            target: runner-admin
            build_args: |
              BACKEND_INTERNAL_URL=http://backend:8000
              NEXT_PUBLIC_PORTAL_URL=https://portail.gathe-finance.horus-lab.com

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: frontend
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
