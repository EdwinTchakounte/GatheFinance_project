# Continuous Deployment vers le serveur de la CLIENTE (VPS Contabo, DMZ durcie :
# Traefik v3.3 + Postgres/MinIO existants, réseaux edge/data).
#
# Déclenchement :
#   - workflow_run "CI" succeeded sur main -> deploy automatique (prod client)
#   - workflow_dispatch                     -> deploy manuel (rejouer ou pin tag)
#
# ⚠️ NOMS DISSOCIÉS (voir infra/DEPLOY_ENVIRONMENTS.md) : ce workflow n'utilise
# QUE des secrets/variables préfixés CLIENT_*. Il n'existe AUCUN repli sur les
# secrets `VPS_*` (qui pointent sur notre Contabo/horus-lab de recette) : si la
# config client est absente, le job s'ignore proprement plutôt que de déployer
# la cliente sur le mauvais serveur.
#
# Config côté GitHub — Settings > Secrets and variables > Actions :
#   Secrets (Environment `production`) :
#     CLIENT_VPS_HOST             IP/hostname du serveur cliente
#     CLIENT_VPS_USER             utilisateur SSH (root ou deploy)
#     CLIENT_VPS_SSH_PRIVATE_KEY  clé privée ed25519 dédiée déploiement client
#     CLIENT_VPS_DEPLOY_PATH      (opt.) chemin repo — défaut /opt/gathe-finance
#   Variables :
#     CLIENT_SITE_DOMAIN   app.gathe-finance.com   (vitrine)
#     CLIENT_API_DOMAIN    api.gathe-finance.com
#     CLIENT_PORTAL_DOMAIN portail.gathe-finance.com
#     CLIENT_ADMIN_DOMAIN  admin.gathe-finance.com
#     CLIENT_CMS_DOMAIN    cms.gathe-finance.com
#
# ⚠️ Le rattachement DMZ (EDGE_NETWORK, DATA_NETWORK, TRAEFIK_CERTRESOLVER,
#    DATABASE_URL, AWS_S3_*) N'EST PAS de la config GitHub : ce sont des valeurs
#    serveur, à mettre dans infra/.env.prod SUR le VPS (cf. .env.prod.client.example).
#
# Pré-requis serveur cliente (bootstrap manuel 1×, cf. DEPLOY_ENVIRONMENTS.md) :
#   - Repo cloné dans CLIENT_VPS_DEPLOY_PATH
#   - infra/.env.prod rempli (secrets Django + DATABASE_URL/MinIO/Brevo/réseaux DMZ) — jamais commité
#   - docker login ghcr.io fait avec un PAT read:packages
#   - DNS app./api./cms./portail./admin. -> IP serveur cliente (AVANT 1er start, pour l'ACME)
#   - Réseaux `edge` (Traefik) et `data` (Postgres/MinIO) existants : on s'y rattache,
#     on ne lance NI notre Traefik, NI notre Postgres.

name: Deploy to client (prod)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag d'images GHCR à déployer (latest, main, sha-XXXX)"
        required: false
        default: "latest"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy on client server (DMZ Traefik)
    runs-on: ubuntu-latest

    # Ne tourne que si CI verte OU dispatch manuel.
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    environment:
      name: production
      url: https://app.gathe-finance.com

    steps:
      - name: Checkout (compose files + scripts)
        uses: actions/checkout@v4

      - name: Guard - config client présente ?
        id: guard
        run: |
          if [ -z "${{ secrets.CLIENT_VPS_HOST }}" ]; then
            echo "::warning::Config client absente (secret CLIENT_VPS_HOST vide) - deploy ignoré. Renseigne Settings > Environments > production (CLIENT_VPS_*)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve image tag
        if: steps.guard.outputs.skip == 'false'
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Hash infra/ pour détecter changement compose
        if: steps.guard.outputs.skip == 'false'
        id: infra_hash
        run: |
          HASH=$(find infra/ -type f \( -name "*.yml" -o -name "*.conf" -o -name "*.sh" \) -print0 \
            | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-12)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Upload infra/ vers le serveur cliente
        if: steps.guard.outputs.skip == 'false'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CLIENT_VPS_HOST }}
          username: ${{ secrets.CLIENT_VPS_USER }}
          key: ${{ secrets.CLIENT_VPS_SSH_PRIVATE_KEY }}
          source: "infra/docker-compose.prod.yml,infra/docker-compose.client.yml,infra/scripts/*"
          target: "${{ secrets.CLIENT_VPS_DEPLOY_PATH || '/opt/gathe-finance' }}/"
          overwrite: true
          strip_components: 0

      - name: "Deploy via SSH (DMZ : rattachement Traefik/Postgres/MinIO, tag :main)"
        if: steps.guard.outputs.skip == 'false'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CLIENT_VPS_HOST }}
          username: ${{ secrets.CLIENT_VPS_USER }}
          key: ${{ secrets.CLIENT_VPS_SSH_PRIVATE_KEY }}
          command_timeout: 12m
          script: |
            set -euo pipefail

            INFRA_HASH="${{ steps.infra_hash.outputs.hash }}"
            DEPLOY_PATH="${{ secrets.CLIENT_VPS_DEPLOY_PATH || '/opt/gathe-finance' }}"
            NEW_TAG="${{ steps.tag.outputs.tag }}"

            # Architecture DMZ cliente : on se rattache au Traefik v3.3 existant
            # (réseau `edge`) + Postgres/MinIO (réseau `data`). On NE lance PAS
            # notre db/traefik/backup/beszel → --no-deps + services nommés.
            COMPOSE="docker compose -f docker-compose.prod.yml -f docker-compose.client.yml --env-file .env.prod"
            APP_SERVICES="backend qcluster site portal admin"

            cd "$DEPLOY_PATH/infra"

            # Force-recreate si l'infra a changé (propage les nouvelles env vars).
            HASH_FILE="$DEPLOY_PATH/.infra_hash"
            PREV_HASH=$(cat "$HASH_FILE" 2>/dev/null || echo "none")
            if [ "$PREV_HASH" != "$INFRA_HASH" ]; then
              RECREATE_FLAG="--force-recreate"
            else
              RECREATE_FLAG=""
            fi
            echo "$INFRA_HASH" > "$HASH_FILE"

            CURRENT_TAG=$(grep "^GATHE_IMAGE_TAG=" .env.prod | cut -d= -f2 || echo "main")
            echo ">>> Current tag: $CURRENT_TAG | New tag: $NEW_TAG"
            sed -i.bak "s/^GATHE_IMAGE_TAG=.*/GATHE_IMAGE_TAG=$NEW_TAG/" .env.prod

            echo ">>> Pulling images..."
            $COMPOSE pull $APP_SERVICES

            echo ">>> Starting services (--no-deps)... ${RECREATE_FLAG:-(no recreate)}"
            $COMPOSE up -d --no-deps ${RECREATE_FLAG} $APP_SERVICES

            echo ">>> Waiting for backend healthcheck..."
            for i in $(seq 1 18); do
              STATUS=$($COMPOSE ps --format json backend 2>/dev/null | grep -o '"Health":"[^"]*"' | cut -d'"' -f4 || echo "unknown")
              echo "  attempt $i/18: backend=$STATUS"
              [ "$STATUS" = "healthy" ] && break
              if [ "$i" -eq "18" ]; then
                echo "!!! Backend never healthy. Rolling back to $CURRENT_TAG."
                sed -i.bak "s/^GATHE_IMAGE_TAG=.*/GATHE_IMAGE_TAG=$CURRENT_TAG/" .env.prod
                $COMPOSE up -d --no-deps $APP_SERVICES
                exit 1
              fi
              sleep 5
            done

            echo ">>> Deploy OK on $NEW_TAG"
            $COMPOSE ps

      - name: Smoke tests (domaines client)
        if: steps.guard.outputs.skip == 'false'
        env:
          SITE_DOMAIN: ${{ vars.CLIENT_SITE_DOMAIN }}
          API_DOMAIN: ${{ vars.CLIENT_API_DOMAIN }}
          PORTAL_DOMAIN: ${{ vars.CLIENT_PORTAL_DOMAIN }}
          ADMIN_DOMAIN: ${{ vars.CLIENT_ADMIN_DOMAIN }}
          CMS_DOMAIN: ${{ vars.CLIENT_CMS_DOMAIN }}
        run: |
          set -e
          FAILED=0
          for url in \
            "https://${API_DOMAIN}/healthz/" \
            "https://${SITE_DOMAIN}/" \
            "https://${PORTAL_DOMAIN}/" \
            "https://${ADMIN_DOMAIN}/" \
            "https://${CMS_DOMAIN}/admin/"
          do
            code=$(curl -sLo /dev/null -w "%{http_code}" --max-time 15 "$url" || echo "000")
            if [[ "$code" =~ ^(2|3) ]]; then
              echo "✓ $url -> HTTP $code"
            else
              echo "✗ $url -> HTTP $code"; FAILED=$((FAILED+1))
            fi
          done
          [ "$FAILED" -gt 0 ] && { echo "!!! $FAILED endpoint(s) en échec."; exit 1; } || echo "Tous les endpoints client répondent OK."
