<?xml version="1.0" encoding="UTF-8"?>
<!-- Slide 2 — Banking mobile : smartphone solde + transactions + cartes XAF. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <!-- Halo background -->
  <circle cx="120" cy="120" r="110" fill="#dcfce7" opacity="0.45"/>
  <circle cx="120" cy="120" r="78" fill="#bbf7d0" opacity="0.4"/>

  <!-- Floating coin top-right -->
  <circle cx="190" cy="50" r="14" fill="#16a34a"/>
  <text x="190" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="14" fill="#ffffff">F</text>

  <!-- Floating coin bottom-left -->
  <circle cx="40" cy="170" r="11" fill="#16a34a"/>
  <text x="40" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="11" fill="#ffffff">F</text>

  <!-- Card behind phone (slight rotation) -->
  <g transform="rotate(-8 70 130)">
    <rect x="38" y="106" width="78" height="48" rx="8" fill="#1d4ed8"/>
    <rect x="46" y="124" width="22" height="6" rx="1" fill="#fbbf24"/>
    <rect x="46" y="138" width="50" height="3" rx="1" fill="#ffffff" opacity="0.4"/>
    <rect x="46" y="144" width="34" height="3" rx="1" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- Phone body -->
  <rect x="72" y="32" width="96" height="180" rx="18" fill="#0f172a"/>
  <rect x="78" y="42" width="84" height="158" rx="10" fill="#f8fafc"/>

  <!-- Notch -->
  <rect x="106" y="46" width="28" height="4" rx="2" fill="#0f172a"/>

  <!-- Top status row -->
  <circle cx="86" cy="64" r="3" fill="#16a34a"/>
  <rect x="93" y="62" width="22" height="4" rx="1.5" fill="#cbd5e1"/>
  <rect x="148" y="62" width="8" height="4" rx="1.5" fill="#cbd5e1"/>

  <!-- Balance label -->
  <text x="120" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-weight="500" font-size="8" fill="#64748b">Solde disponible</text>

  <!-- Amount -->
  <text x="120" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="18" fill="#0f172a">125 000</text>
  <text x="120" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="10" fill="#16a34a">FCFA</text>

  <!-- Divider -->
  <line x1="86" y1="134" x2="154" y2="134" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Tx row 1 -->
  <circle cx="92" cy="150" r="6" fill="#16a34a"/>
  <path d="M 89 150 L 91 152 L 95 148" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="104" y="146" width="40" height="3" rx="1.5" fill="#0f172a"/>
  <rect x="104" y="152" width="26" height="3" rx="1.5" fill="#cbd5e1"/>

  <!-- Tx row 2 -->
  <circle cx="92" cy="170" r="6" fill="#2563eb"/>
  <path d="M 89 170 L 95 170 M 92 167 L 92 173" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="104" y="166" width="36" height="3" rx="1.5" fill="#0f172a"/>
  <rect x="104" y="172" width="22" height="3" rx="1.5" fill="#cbd5e1"/>

  <!-- Tx row 3 -->
  <circle cx="92" cy="190" r="6" fill="#fbbf24"/>
  <rect x="89" y="188" width="6" height="4" rx="0.8" fill="#ffffff"/>
  <rect x="104" y="186" width="44" height="3" rx="1.5" fill="#0f172a"/>
  <rect x="104" y="192" width="20" height="3" rx="1.5" fill="#cbd5e1"/>
</svg>
