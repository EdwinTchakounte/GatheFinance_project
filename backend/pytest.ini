[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --tb=short --reuse-db
testpaths = tests apps_coop
filterwarnings =
    ignore::DeprecationWarning:wagtail.*
    ignore::DeprecationWarning:django_filters.*
markers =
    integration: tests qui touchent la DB et les hooks métier (lents)
    unit: tests purement isolés (rapides)
