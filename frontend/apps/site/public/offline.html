<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hors ligne — Gathe Finance</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; margin: 0; }
      body {
        font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 2rem; text-align: center;
        background: linear-gradient(135deg, #082e58 0%, #051d3a 60%, #06101f 100%); color: #fff;
      }
      .card { max-width: 32rem; }
      .badge { width: 56px; height: 56px; border-radius: 14px; background: #0e4d92; display: inline-flex;
        align-items: center; justify-content: center; font-size: 32px; font-weight: 700; margin-bottom: 1.5rem; }
      h1 { font-size: 1.75rem; margin-bottom: .75rem; }
      p { color: #c2dcf4; line-height: 1.6; margin-bottom: 1.75rem; }
      a { display: inline-block; background: #3aaa35; color: #fff; text-decoration: none; font-weight: 600;
        padding: .75rem 1.5rem; border-radius: 10px; }
      a:hover { background: #2f8e2b; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">G</div>
      <h1>Vous êtes hors ligne</h1>
      <p>
        Impossible de joindre Gathe Finance pour le moment. Vérifiez votre connexion, puis réessayez.<br />
        <span style="opacity:.8">You appear to be offline. Check your connection and try again.</span>
      </p>
      <a href="/">Réessayer / Retry</a>
    </div>
  </body>
</html>
