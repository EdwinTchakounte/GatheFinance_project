<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Maskable safe zone : tout le contenu visible reste dans le 80% central
       (centre 51..461 sur un canvas 512). Le carré paper occupe 100%. -->
  <rect width="512" height="512" fill="#FBFAF5"/>

  <!-- G vert signature -->
  <text
    x="256"
    y="316"
    text-anchor="middle"
    font-family="Sora, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="260"
    font-weight="800"
    letter-spacing="-8"
    fill="#3AAA35"
  >G</text>

  <!-- Courbe verte signature -->
  <path
    d="M 86 388 C 200 348, 312 348, 426 388"
    stroke="#3AAA35"
    stroke-width="24"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Point cobalt -->
  <circle cx="420" cy="140" r="20" fill="#0E4D92"/>
</svg>
