# nginx reverse-proxy — Gathé Finance (sous gathe-finance.horus-lab.com)
# ===========================================================================
# À placer dans /etc/nginx/sites-available/gathe-finance.conf puis :
#   ln -s ../sites-available/gathe-finance.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Certificats : obtenir via certbot (un seul certif multi-domaines) :
#   certbot --nginx -d gathe-finance.horus-lab.com \
#     -d portail.gathe-finance.horus-lab.com -d admin.gathe-finance.horus-lab.com \
#     -d api.gathe-finance.horus-lab.com -d cms.gathe-finance.horus-lab.com
# (certbot réécrit/duplique les chemins ssl_certificate ci-dessous.)
#
# Les upstreams pointent sur les ports publiés par docker-compose.nginx.yml.
# ===========================================================================

# Redirection HTTP -> HTTPS (tous les sous-domaines)
server {
    listen 80;
    listen [::]:80;
    server_name gathe-finance.horus-lab.com portail.gathe-finance.horus-lab.com
                admin.gathe-finance.horus-lab.com api.gathe-finance.horus-lab.com
                cms.gathe-finance.horus-lab.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# --- En-têtes proxy communs (à inclure dans chaque location) ---------------
# Copie ce bloc map une fois (http{} global) si tu veux le WebSocket upgrade :
map $http_upgrade $connection_upgrade { default upgrade; "" close; }

# --- Vitrine (site) --------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gathe-finance.horus-lab.com;
    ssl_certificate     /etc/letsencrypt/live/gathe-finance.horus-lab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gathe-finance.horus-lab.com/privkey.pem;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# --- Portail membre --------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name portail.gathe-finance.horus-lab.com;
    ssl_certificate     /etc/letsencrypt/live/gathe-finance.horus-lab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gathe-finance.horus-lab.com/privkey.pem;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# --- Admin (back-office) ---------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.gathe-finance.horus-lab.com;
    ssl_certificate     /etc/letsencrypt/live/gathe-finance.horus-lab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gathe-finance.horus-lab.com/privkey.pem;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# --- API Django + CMS Wagtail (même conteneur backend) ---------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.gathe-finance.horus-lab.com cms.gathe-finance.horus-lab.com;
    ssl_certificate     /etc/letsencrypt/live/gathe-finance.horus-lab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gathe-finance.horus-lab.com/privkey.pem;
    client_max_body_size 50m;   # uploads documents/CMS

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # requis par Django prod
    }
}
