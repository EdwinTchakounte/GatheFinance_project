# --- Monitoring Beszel (profil `monitoring`, optionnel) --------------------
# Prérequis TLS : le certificat gathe-finance.horus-lab.com doit inclure le SAN
# monitor.gathe-finance.horus-lab.com. Ré-émettre avec certbot en AJOUTANT ce
# domaine à la liste `-d` existante (sinon handshake TLS KO sur ce vhost).
# Beszel pousse des mises à jour temps réel → headers Upgrade/Connection requis.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name monitor.gathe-finance.horus-lab.com;
    ssl_certificate     /etc/letsencrypt/live/gathe-finance.horus-lab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gathe-finance.horus-lab.com/privkey.pem;
    client_max_body_size 25m;

    resolver 127.0.0.11 valid=30s ipv6=off;
    location / {
        set $up http://gathe-beszel:8090;
        proxy_pass $up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# --- API Django + CMS Wagtail (même conteneur backend) ---------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.gathe-finance.horus-lab.com cms.gathe-finance.horus-lab.com;
    ssl_certificate     /etc/letsencrypt/live/gathe-finance.horus-lab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gathe-finance.horus-lab.com/privkey.pem;
    client_max_body_size 50m;   # uploads documents / CMS

    resolver 127.0.0.11 valid=30s ipv6=off;
    location / {
        set $up http://gathe-backend:8000;
        proxy_pass $up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # requis par Django prod
    }
}
