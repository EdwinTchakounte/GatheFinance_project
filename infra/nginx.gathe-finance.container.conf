# nginx reverse-proxy — Gathé Finance, quand nginx tourne DANS UN CONTENEUR
# ===========================================================================
# Prérequis : ton conteneur nginx ET les services Gathé partagent le même
# réseau Docker (voir docker-compose.nginx-external.yml → PROXY_NETWORK).
# nginx atteint alors les apps par leur alias : gathe-site / gathe-portal /
# gathe-admin / gathe-backend.
#
# Place ce fichier dans le conf.d de ton conteneur nginx (ex. monté sur
# /etc/nginx/conf.d/gathe-finance.conf), adapte les chemins de certifs à ta
# gestion TLS (certbot/companion), puis recharge : nginx -s reload.
#
# `resolver 127.0.0.11` = DNS interne Docker → résolution des noms à l'exécution
# (les conteneurs Gathé peuvent redémarrer et changer d'IP sans casser nginx).
# ===========================================================================

map $http_upgrade $connection_upgrade { default upgrade; "" close; }

# Redirection HTTP -> HTTPS (tous les sous-domaines)
server {
    listen 80;
    listen [::]:80;
    server_name gathe-finance.horus-lab.com portail.gathe-finance.horus-lab.com
                admin.gathe-finance.horus-lab.com api.gathe-finance.horus-lab.com
                cms.gathe-finance.horus-lab.com monitor.gathe-finance.horus-lab.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# --- Vitrine (site) --------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gathe-finance.horus-lab.com;
    ssl_certificate     /etc/letsencrypt/live/gathe-finance.horus-lab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gathe-finance.horus-lab.com/privkey.pem;
    client_max_body_size 25m;

    resolver 127.0.0.11 valid=30s ipv6=off;
    location / {
        set $up http://gathe-site:3000;
        proxy_pass $up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

