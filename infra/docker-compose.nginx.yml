# Override pour un déploiement derrière TON nginx (au lieu de Traefik).
# ---------------------------------------------------------------------------
# Usage :
#   cd infra
#   docker compose -f docker-compose.prod.yml -f docker-compose.nginx.yml up -d --build
#   (NB : ne pas passer `--profile traefik` → Traefik ne démarre pas)
#
# Chaque service est publié sur 127.0.0.1:<port> (uniquement en local, donc non
# exposé directement à Internet) ; nginx fait le reverse-proxy + TLS dessus.
#
#   gathe-finance.horus-lab.com          → 127.0.0.1:8090   (site)
#   portail.gathe-finance.horus-lab.com  → 127.0.0.1:8091   (portal)
#   admin.gathe-finance.horus-lab.com    → 127.0.0.1:8092   (admin)
#   api.gathe-finance.horus-lab.com      → 127.0.0.1:8000   (backend / API)
#   cms.gathe-finance.horus-lab.com      → 127.0.0.1:8000   (backend / Wagtail)
#
# Important côté nginx : transmettre `proxy_set_header X-Forwarded-Proto $scheme;`
# (Django prod lit cet en-tête → pas de boucle de redirection HTTPS).
# Voir nginx.gathe-finance.conf pour un exemple complet.

services:
  backend:
    ports:
      - "127.0.0.1:8000:8000"

  site:
    ports:
      - "127.0.0.1:8090:3000"

  portal:
    ports:
      - "127.0.0.1:8091:3000"

  admin:
    ports:
      - "127.0.0.1:8092:3000"
